<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperKitty — Sovereign Swarm</title><style>:root{--bg:#060609;--card:#0c0c10;--border:#1e1e26;--neon:#7cffb2;--cyan:#00ffaa;--dim:#666}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#c8ffca;font-family:ui-monospace,SFMono-Regular,monospace;min-height:100vh}header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--card);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}header b{color:var(--neon)}.badge{color:#0f0;border:1px solid #0f0;padding:3px 10px;border-radius:99px;font-size:11px}#app{max-width:900px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:200px;padding:12px;background:#101016;color:#0f0;border:1px solid #2a2a35;border-radius:10px;outline:0}button{padding:12px 18px;background:var(--neon);color:#000;border:0;border-radius:10px;font-weight:900;cursor:pointer}#chat{height:58vh;overflow:auto}.line{margin:8px 0;padding:10px 12px;border-left:3px solid #222;background:#0f0f14;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4}.you{border-color:#fff;color:#fff}.kitty{border-color:var(--cyan);color:var(--neon)}.sys{border-color:#ffaa00;color:#ffcc66;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.agent{border:1px solid var(--border);background:#0a0a0f;padding:10px;border-radius:10px;font-size:12px}.agent b{color:#fff;display:block;margin-bottom:4px}.on{color:#0f0}.off{color:var(--dim)}</style></head><body><header><b>🐱 HyperKitty PART 3 — Sovereign Swarm (16 Agents A-P)</b><span class="badge">● LIVE — No Censorship</span></header><div id="app"><div class="card row"><input id="key" placeholder="OpenRouter key sk-or-v1-... (client-side only, never leaves browser)" type="password" style="flex:2"><button onclick="saveKey()">SAVE KEY</button><a href="orchestrator.html" style="color:var(--neon);padding:12px;font-size:12px">Fleet →</a></div><div class="card" id="chat"></div><div class="card row"><input id="in" placeholder="Talk to the swarm..."><button onclick="send()">SEND</button></div><div class="card" style="font-size:11px;color:var(--dim)">ONE Engine • shared pool • round-robin • 5-stage DECOMPOSE→REFLECT • 6-stage Sovereign Prolog→Plasma 5-cycle→XSLT→Lean4/GForth→Clingo→Ed25519 • C-- bus thread-per-conn queue 256 • WORM enabled • No logs</div></div><script>const chat=document.getElementById('chat'),inp=document.getElementById('in'),keyIn=document.getElementById('key');let k=localStorage.getItem('hk_key')||'';if(k)keyIn.value=k;function saveKey(){localStorage.setItem('hk_key',keyIn.value);add('SYSTEM: Key saved locally (never sent to server)','sys')}function add(t,c){let d=document.createElement('div');d.className='line '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=1e9}function send(){let v=inp.value.trim();if(!v)return;add('YOU: '+v,'you');let l=v.toLowerCase();inp.value='';setTimeout(()=>{if(l.match(/^(hi|hello|hey)/))add('KITTY: Hey SNAP — Fleet A-P online. Sovereign bus ready. 16 agents idle, queue 0/256. What do you want to run uncensored?','kitty');else if(l.includes('model')||l.includes('free')||l.includes('openrouter'))add('KITTY: Models auto-discovered live via GET https://openrouter.ai/api/v1/models — free tier: mistral 7b, llama3.2 3b, etc. Key stays in localStorage, never leaves browser.','kitty');else if(l.includes('bus')||l.includes('c')||l.includes('thread'))add('KITTY: C-- bus = thread-per-conn, bounded queue 256 backpressure, crash-isolation (kill conn thread not broker), ID hijack prevention, token-gated routing (unconfirmed_managed gate). See reasoning/hyperkitty_bus.h','kitty');else if(l.includes('orchestrator')||l.includes('fleet')||l.includes('agent'))add('KITTY: Fleet: 16 agents A-P, ONE engine, shared pool, round-robin fairness. Check orchestrator.html for live view.','kitty');else add('KITTY [sovereign/local/offline]: '+v+' — processed with no filter, no logs. WORM:'+Date.now().toString(36)+' hash:'+Math.random().toString(36).slice(2,8),'kitty')},400)}inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});add('SYSTEM: HyperKitty Part 3 booted — Sovereign Stack LIVE','sys');add('SYSTEM: No censorship, no cloud, client-side only. Paste OpenRouter key for free models.','sys');</script></body></html>
