<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Orchestrator — HyperKitty</title><style>body{background:#050507;color:#9effa7;font-family:monospace;padding:16px}h1{color:#7cffb2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:16px 0}.card{border:1px solid #1e1e26;background:#0c0c10;padding:12px;border-radius:10px}.card b{display:block;color:#fff;margin-bottom:6px}.on{color:#0f0}.off{color:#555}input{padding:10px;background:#111;color:#0f0;border:1px solid #333;width:100%;margin-top:10px}</style></head><body><h1>🐱 HyperKitty Fleet Orchestrator — 16 Agents</h1><div>OpenRouter Key (client-side only, never leaves browser): <input id="key" placeholder="sk-or-v1-..." type="password"></div><div class="grid" id="grid"></div><script>const g=document.getElementById('grid');for(let i=0;i<16;i++){let l=String.fromCharCode(65+i);let d=document.createElement('div');d.className='card';d.innerHTML=`<b>Agent ${l}</b><span class="${i<2?'on':'off'}">${i<2?'● ONLINE - idle':'○ STANDBY'}</span><div style="font-size:11px;margin-top:8px;color:#666">Model: llama3.2:3b<br>Queue: 0/256<br>WORM: enabled</div>`;g.appendChild(d)}</script></body></html>
